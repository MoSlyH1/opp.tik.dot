# Small hosted clips (144p + 240p) for the most-watched Internet Archive videos, published on the
# `clips` branch, which GitHub Pages serves for free. No Cloudflare.
#
# One-time setup (see README, "What's new in v12"):
#   1. Repo -> Settings -> Secrets and variables -> Actions -> New secret: DATABASE_URL (your Neon link)
#   2. Actions -> clips -> Run workflow (creates the `clips` branch)
#   3. Repo -> Settings -> Pages -> Source: Deploy from a branch -> branch `clips`, folder / (root) -> Save
#   4. Vercel -> Environment Variables -> CLIPS_BASE = https://<your-user>.github.io/<repo>   (no slash at the end)
# After that it runs by itself every day and adds more clips (stops near GitHub Pages' 1 GB limit).
name: clips
on:
  schedule: [{ cron: "30 5 * * *" }]   # daily, after the 04:00 ingest
  workflow_dispatch:
    inputs:
      limit: { description: "Clips to make in this run", default: "300" }
permissions:
  contents: write                      # lets the built-in token push the `clips` branch
concurrency: { group: clips, cancel-in-progress: false }
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: pip install -r backend/requirements.txt

      # The `clips` branch holds only the finished files. Fetch it WITHOUT downloading the videos
      # already on it (blobless fetch + index only), so a run stays fast however big it grows.
      - name: Prepare the clips branch
        run: |
          set -e
          AUTH="Authorization: basic $(printf 'x-access-token:%s' "${{ github.token }}" | base64 -w0)"
          git init -q clips-repo && cd clips-repo
          git config user.name "opp-clips" && git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git config http.https://github.com/.extraheader "$AUTH"
          if git ls-remote --exit-code --heads origin clips >/dev/null 2>&1; then
            git fetch -q --depth 1 --filter=blob:none origin clips
            git update-ref refs/heads/clips FETCH_HEAD && git symbolic-ref HEAD refs/heads/clips
            git read-tree HEAD
          else
            git checkout -q --orphan clips
          fi
          mkdir -p c
          git rm -q --cached --ignore-unmatch _headers   # v11 Cloudflare file, not needed any more
          touch .nojekyll                                 # GitHub Pages: publish the files as they are
          printf 'opp.tik.dot clips\n' > index.html

      - name: Encode clips
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLIP_SECONDS: "30"          # matches the feed's default length: half the work and size of 60 s
          CLIP_WORKERS: "4"
          CLIP_QUALITIES: "240,144"   # 240p for Auto, 144p for Data saver
          CLIPS_MAX_MB: "950"         # GitHub Pages sites must stay under 1 GB
        run: python -m app.clips --limit "${{ github.event.inputs.limit || '300' }}" --out ../clips-repo/c --manifest ../clips-manifest.json

      - name: Publish to the clips branch
        if: always()          # publish what was made, even if encoding stopped early
        id: publish
        run: |
          set -e
          cd clips-repo
          git add --ignore-removal .nojekyll index.html c   # add only: files from earlier runs are not on disk here, never delete them
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "clips: $(ls c | wc -l) new"
          git push -q origin clips

      # Only after the files are published: tell the app they exist.
      - name: Tell the app
        if: steps.publish.outcome == 'success'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.clips --apply ../clips-manifest.json